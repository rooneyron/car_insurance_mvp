services:
  app:
    build: .
    volumes:
      - ./:/app
      - C:\Users\HH\.cache\huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://insurance_user:insurance_pwd123@db:5432/insurance_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pwd123
      POSTGRES_DB: insurance_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: