services:
  app:
    build: .
    # .env 注入容器环境变量（FEISHU_APP_ID/SECRET、ACCESS_TOKEN_SECRET 等密钥）：
    # .dockerignore 已排除 .env（不打进镜像层，避免密钥进 registry），运行时靠 env_file 显式注入；
    # 下方 environment 的同名变量（DATABASE_URL/USE_LOCAL_RERANK）优先级更高，会覆盖 .env 里的值。
    # 飞书机器人是 app.py 内的后台 daemon 线程（in-process 直连 chat_api），随主服务一起起，
    # 出站连飞书 WS(msg-frontier.feishu.cn)，无需额外端口或独立服务。
    env_file:
      - .env
    volumes:
      - ./:/app
      # HF 缓存：宿主机 HF_HOME=D:\caches\huggingface（bge-reranker-base 模型在此），挂到容器
      # HF 默认缓存位置，rerank 的 local_files_only=True 才能离线读到模型（原 C:\Users\HH\.cache 路径无模型）。
      # 阿里云部署时若模型已打进镜像或走 API rerank，可注释掉此行。
      - D:\caches\huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://insurance_user:insurance_pwd123@db:5432/insurance_db
      - USE_LOCAL_RERANK=true
      # 禁用 HuggingFace XET 协议（v1.20+ 默认启用），避免 local_files_only=True 时仍尝试联系 CAS 服务器报 401
      - HF_HUB_DISABLE_XET=1
    # GPU 透传：把宿主机 NVIDIA GPU 分配给容器，否则容器内 torch.cuda.is_available()=False。
    # 前提：Docker Desktop 用 WSL2 后端 + Windows NVIDIA 驱动（本机 591.86 已满足）。
    # 阿里云部署若无 GPU，注释掉整个 deploy 块，改用 requirements-prod.txt + USE_LOCAL_RERANK=false。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pwd123
      POSTGRES_DB: insurance_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: