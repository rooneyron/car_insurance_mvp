# 车险智能客服 - 路由与业务配置

# ============================================================
# Router 四层漏斗配置
# ============================================================
router:
  # L0 安全拦截关键词（命中立即转人工）
  safety:
    - "转人工"
    - "人工客服"
    - "找客服"
    - "客服"
    - "人工"
    - "投诉"
    - "保监会"
    - "监管"
  # L1 关键词配置（high=明确拦截，mid=透传L2）
  keyword:
    high:
      sales:
        - "我要买车险"
        - "我想续保"
        - "买车险"
        - "续保"
      after_sales:
        - "我要理赔"
        - "我要报案"
        - "查保单"
        - "理赔进度"
        - "报案"
        - "加保"
    mid:
      sales:
        - "报价"
        - "保费"
        - "投保"
        - "多少钱"
        - "买保险"
      after_sales:
        - "理赔"
        - "出险"
        - "保单"
        - "爆胎"
        - "刮蹭"
        - "撞车"
        - "事故"


# ============================================================
# 旧版关键词（保持向后兼容，旧 routing.py 仍在使用）
# ============================================================
keywords:
  sale:
    - "续保"
    - "报价"
    - "保费"
    - "投保"
    - "买保险"
    - "多少钱"

  service:
    - "理赔"
    - "出险"
    - "报案"
    - "保单"
    - "投诉"
    - "转人工"
    - "人工"
    - "爆胎"
    - "刮蹭"
    - "撞车"
    - "事故"

  force_service:
    - "事故"
    - "紧急"
